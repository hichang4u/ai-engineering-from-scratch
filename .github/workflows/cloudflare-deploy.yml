name: cloudflare-deploy

# Builds the site and deploys it to Cloudflare Workers (cloudflare/README.md).
# Runs after every translate run too, because the build reads the published
# translation coverage from the translations branch to decide which lessons
# render server-side in Korean.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [translate]
    types: [completed]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_DEPLOY != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install build tools
        working-directory: cloudflare
        run: npm install --no-audit --no-fund

      - name: Test the Worker router
        working-directory: cloudflare
        run: npm test

      - name: Build site, assets and Worker
        env:
          AIFS_ORIGIN: ${{ vars.AIFS_ORIGIN }}
        run: node cloudflare/build.mjs

      - name: Deploy
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set; skipping deploy."
            exit 0
          fi
          npx wrangler deploy
